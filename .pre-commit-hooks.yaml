# pre-commit (https://pre-commit.com) passes selected paths to the Git index
# scan. The CLI reads staged blobs for those paths.
- id: sensitive-data-sanitizer
  name: sensitive-data-sanitizer (credentials)
  description: Block commits that contain credentials.
  entry: sensitive-data-sanitizer scan --staged --credentials-only --
  language: node
  types: [text]
  require_serial: true
- id: sensitive-data-sanitizer-pii
  name: sensitive-data-sanitizer (credentials and personal data)
  description: Block commits that contain credentials or personal data.
  entry: sensitive-data-sanitizer scan --staged --
  language: node
  types: [text]
  require_serial: true
