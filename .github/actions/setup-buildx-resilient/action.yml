name: 'Set up Docker Buildx (resilient)'
description: >
  Use upstream BuildKit pull retries, then fall back to an independent registry
  mirror when Docker Hub remains unavailable (issue #75).
inputs:
  buildkit-image:
    description: 'Pinned BuildKit image used by the docker-container driver.'
    required: false
    default: 'moby/buildkit:v0.34.2'
  registry-mirror:
    description: 'Fallback Docker Hub mirror host; empty disables fallback.'
    required: false
    default: 'mirror.gcr.io'
  verbose:
    description: 'Enable upstream debug logging; RUNNER_DEBUG is also honored.'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # v4.4.1 pre-pulls through actions-toolkit's bounded transient-error retry.
    # Let the official action own that policy instead of duplicating it here.
    - name: Set up Docker Buildx from canonical registry
      id: canonical
      continue-on-error: ${{ inputs.registry-mirror != '' }}
      uses: docker/setup-buildx-action@v4.4.1
      env:
        RUNNER_DEBUG: ${{ inputs.verbose == 'true' && '1' || env.RUNNER_DEBUG }}
      with:
        driver-opts: image=${{ inputs.buildkit-image }}

    # The mirror must be the actual driver image: pre-seeding the canonical
    # tag no longer avoids the upstream action's explicit canonical pull.
    - name: Set up Docker Buildx from fallback mirror
      if: steps.canonical.outcome == 'failure' && inputs.registry-mirror != ''
      uses: docker/setup-buildx-action@v4.4.1
      env:
        RUNNER_DEBUG: ${{ inputs.verbose == 'true' && '1' || env.RUNNER_DEBUG }}
      with:
        driver-opts: image=${{ inputs.registry-mirror }}/${{ inputs.buildkit-image }}
